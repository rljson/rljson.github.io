<svg width="420" height="176" viewBox="0 20 420 176" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- A cake: one column per car with the car and its id, and one row per layer: colors, brands and prices -->
<!-- Each layer row has the same gradient across all cars, one step stronger per layer -->
<defs>
<linearGradient id="car-cake-colors" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="currentColor" stop-opacity="0.1"/>
<stop offset="1" stop-color="currentColor" stop-opacity="0.16"/>
</linearGradient>
<linearGradient id="car-cake-brands" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="currentColor" stop-opacity="0.17"/>
<stop offset="1" stop-color="currentColor" stop-opacity="0.23"/>
</linearGradient>
<linearGradient id="car-cake-prices" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="currentColor" stop-opacity="0.24"/>
<stop offset="1" stop-color="currentColor" stop-opacity="0.3"/>
</linearGradient>
</defs>
<rect x="10" y="102" width="400" height="30" fill="url(#car-cake-colors)"/>
<rect x="10" y="132" width="400" height="30" fill="url(#car-cake-brands)"/>
<path d="M10 162H410V184A8 8 0 0 1 402 192H18A8 8 0 0 1 10 184Z" fill="url(#car-cake-prices)"/>
